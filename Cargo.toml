[package]
name = "editorcito-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "editorcito"
path = "src/core/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
