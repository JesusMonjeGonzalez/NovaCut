[package]
name = "editorcito-core"
version = "0.2.0"
edition = "2021"

[lib]
name = "editorcito"
path = "src/core/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "novacut-windows"
path = "src/windows/main.rs"
required-features = ["windows-host"]

[features]
default = []
windows-host = ["dep:eframe", "dep:rfd", "dep:rodio", "dep:ab_glyph"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"

# El host se distribuye para Windows, pero compila también en macOS/Linux
# para poder ejecutar sus pruebas y abrirlo durante el desarrollo.
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] , optional = true }
rfd = { version = "0.17", optional = true }
rodio = { version = "0.20", optional = true, default-features = false }
# Mide el texto de los subtítulos animados con la misma fuente que drawtext.
# Ya lo trae egui: no añade descargas.
ab_glyph = { version = "0.2.32", optional = true }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
