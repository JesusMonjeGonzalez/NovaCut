name: macOS build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Build application
        run: ./build-mac.sh
      - name: Run native harness
        run: ./probar.sh
