name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional: publish a NEW release; run on this tag (v<Cargo.toml version>)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  secrets:
    uses: ./.github/workflows/secrets.yml

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate explicit release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.publish_tag }}
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -cne $env:RELEASE_TAG) {
            throw 'Publication requires running on the explicitly requested tag'
          }
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package version' }
          $version = ($metadata.packages | Where-Object { $_.name -eq 'editorcito-core' }).version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag does not match Cargo.toml version' }
      - name: Set up Rust
        run: rustup update stable --no-self-update
      - name: Verify packaging failure gates
        shell: pwsh
        run: ./tests/build-windows.ps1
      - name: Install installer compiler
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Test and package Windows application
        shell: pwsh
        run: ./build-windows.ps1 -Installer
      # El mismo script que ejecutan el instalador y el botón de la app, en
      # el PowerShell 5.1 que trae Windows: descarga, SHA-256 y arranque.
      - name: Install FFmpeg with the shipped script
        shell: powershell
        run: ./installer/ffmpeg-install.ps1 -InstallDir "$env:RUNNER_TEMP\ffmpeg"
      # Con FFmpeg real, los renders de extremo a extremo (efectos, títulos,
      # subtítulos animados, siete formatos, vuelta a CPU) corren en Windows.
      # Solo se omite la prueba que necesita Whisper y la voz de macOS.
      - name: Real renders on Windows
        shell: pwsh
        env:
          NOVACUT_REQUIRE_REAL: '1'
        run: |
          $env:PATH = "$env:RUNNER_TEMP\ffmpeg;$env:PATH"
          cargo test --locked --features windows-host --bin novacut-windows render_real -- --skip text_based_editing
          if ($LASTEXITCODE -ne 0) { throw "Real render tests failed" }
      - name: Upload portable Windows application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: novacut-windows-x64
          path: build/NovaCut-Windows
          if-no-files-found: error
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: novacut-windows-installer-x64
          path: build/installer/NovaCut-Windows-Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Package universal macOS application
        run: ./package-mac.sh
      - name: Upload macOS application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: novacut-macos-universal
          path: build/release/NovaCut-macOS.zip
          if-no-files-found: error

  publish:
    needs: [build, macos, secrets]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.publish_tag != '' && inputs.publish_tag == github.ref_name
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: novacut-windows-x64
          path: dist/NovaCut-Windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: novacut-windows-installer-x64
          path: dist/installer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: novacut-macos-universal
          path: dist/macos
      - name: Create new alpha release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.publish_tag }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          if [ ! -f "$notes" ]; then echo "Missing release notes: $notes" >&2; exit 1; fi
          (cd dist && zip -r NovaCut-Windows-x64.zip NovaCut-Windows)
          (cd dist && sha256sum installer/NovaCut-Windows-Setup.exe NovaCut-Windows-x64.zip macos/NovaCut-macOS.zip \
            | sed 's#  .*/#  #' > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "NovaCut $RELEASE_TAG" --notes-file "$notes" \
            dist/installer/NovaCut-Windows-Setup.exe dist/NovaCut-Windows-x64.zip \
            dist/macos/NovaCut-macOS.zip dist/SHA256SUMS.txt
