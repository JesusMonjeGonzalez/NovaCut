name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install installer compiler
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Test and package Windows application
        shell: pwsh
        run: ./build-windows.ps1 -Installer
      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: novacut-windows-x64
          path: build/NovaCut-Windows
          if-no-files-found: error
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: novacut-windows-installer-x64
          path: build/installer/NovaCut-Windows-Setup.exe
          if-no-files-found: error
      - name: Refresh alpha release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v0.1.0 --json tagName 2>$null) {
            Compress-Archive -Path build\NovaCut-Windows -DestinationPath build\NovaCut-Windows-x64.zip -Force
            gh release upload v0.1.0 build/installer/NovaCut-Windows-Setup.exe `
              build/NovaCut-Windows-x64.zip --clobber
            Write-Host "Release v0.1.0 refreshed with CI artifacts"
          } else {
            Write-Host "Release v0.1.0 does not exist yet; skipping release refresh"
          }
